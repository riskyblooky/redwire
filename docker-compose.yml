# Rotate container stdout/stderr (json-file has no limit by default and the
# deploy target is a small VPS): 5 × 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    container_name: redwire-db
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redwire}
      POSTGRES_USER: ${POSTGRES_USER:-redwire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redwire}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redwire-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redwire-redis
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redwire-network
    restart: always

  minio:
    image: minio/minio:latest
    container_name: redwire-minio
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}

    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - redwire-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Build metadata surfaced by /health. deploy_server.sh sets these
        # via env before invoking docker compose build; when they're not
        # set (raw ``docker compose build``), the Dockerfile defaults them
        # to "" and the backend falls back to a ``git rev-parse`` probe.
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: redwire-backend:latest
    container_name: redwire-backend
    logging: *default-logging
    # Everything in .env reaches the backend, so optional settings the code
    # reads (PLUGIN_VERIFY, *_MAX_BYTES limits, LDAP_LOGIN_TIMEOUT_S, …) take
    # effect when set there. Keys under `environment:` below win over .env.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-redwire}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-redwire}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_HOURS: 24
      MINIO_ENDPOINT: minio:9000
      # MinIO endpoint the BROWSER will hit. Presigned URLs get their
      # host swapped from MINIO_ENDPOINT to this value before being
      # returned to the frontend.
      #
      # Left unset by default: prod compose intentionally does NOT
      # publish MinIO's port 9000, so there is no correct default we
      # can pick that works everywhere. When unset, storage.py falls
      # back to MINIO_ENDPOINT (`minio:9000`) — presigned URLs will
      # be non-functional in the browser, which is the "obviously
      # broken" state we prefer over silently pointing at a wrong
      # host (the previous default was `localhost:9000`, which meant
      # "the user's laptop, not the server" and would connection-
      # refuse everywhere except a local single-box test).
      #
      # To make presigned URLs work in real prod, either:
      #  (a) publish port 9000 and set MINIO_EXTERNAL_ENDPOINT to
      #      the reachable host:port, or
      #  (b) route MinIO through nginx at /minio/ and point this at
      #      ${DOMAIN_NAME}/minio (requires signature-passthrough
      #      config on the nginx location).
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: redwire-evidence
      MINIO_SECURE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Public URLs for SAML (entity id / ACS), password-reset and
      # notification links. Without these they fell back to localhost.
      # nginx serves the API under /api.
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      BACKEND_URL: ${BACKEND_URL:-https://${DOMAIN_NAME:-localhost}/api}
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN_NAME:-localhost}}
      SQL_ECHO: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@redwire.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # Retention in days (utils/retention.py); unset = the default shown.
      ACTIVITY_PING_RETENTION_DAYS: ${ACTIVITY_PING_RETENTION_DAYS:-}   # 365
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-}     # 90 (read ones only)
      ACTIVITY_LOG_RETENTION_DAYS: ${ACTIVITY_LOG_RETENTION_DAYS:-}     # 0 = keep the audit log forever

    volumes:
      # Persist backend/uploads/ across container rebuilds. profile
      # photos and wordlist uploads are written here as regular files
      # (evidence + vault files go to MinIO, not disk). Without this
      # mount they live only on the container's writable layer and
      # `docker compose build backend` + `up -d` wipes them.
      #
      # Bind-mount to the host — the directory sits next to the
      # compose file at ./backend/uploads and shows up on the host
      # filesystem so an operator can back it up with `tar`, `ls` it
      # for debugging, or move it during a host migration. The
      # backend runs as UID 10001 inside the container, so the host
      # directory must be owned by it — deploy_server.sh chowns it
      # (a fresh Docker-created dir would be root-owned and unwritable).
      #
      # `backend/uploads/` is git-ignored and excluded from the
      # deploy zip, so nothing in the source tree collides with it.
      # Docker auto-creates the directory on first `up` if it
      # doesn't exist yet.
      - ./backend/uploads:/app/uploads
      # nginx's JSON access log (written by the nginx service) — ingested
      # for the admin Security Center, truncated once read.
      - nginx_logs:/var/log/redwire-nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # No volume mount for source code in production
    # `alembic upgrade head` runs first so a fresh `docker compose up`
    # boots cleanly — without it, the backend hits an empty schema, the
    # `_seed_admin_user` query 500s ("relation users does not exist"),
    # and the container crash-loops until migrations are applied
    # out-of-band. `scripts/deploy_server.sh` already runs migrations
    # before the stack comes up, so this is a no-op on the canonical
    # deploy path; it only fires on a `docker compose up`-only flow.
    # Safe because RedWire runs a single backend container: migrations run
    # once, before uvicorn starts its workers.
    # --forwarded-allow-ips: trust X-Forwarded-* / X-Real-IP only from
    # private docker bridge subnets (where nginx lives), not '*' which
    # let any TCP peer claim to be the proxy. GHSA-xg53-8wgq-w9cw.
    # --workers: cross-worker state (WebSocket fan-out, presence, rate
    # limits, wordlist filter, plugin toggles) goes through Redis, and
    # startup seeding is serialised with a Postgres advisory lock. About
    # 200 MB per worker; set BACKEND_WORKERS in .env to change it.
    command: sh -c "python migrate.py upgrade heads && exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-2} --proxy-headers --forwarded-allow-ips='172.16.0.0/12'"
    networks:
      - redwire-network
    restart: always

  frontend:
    build:
      # Build context is the repo root so the frontend image can COPY
      # ../backend/plugins into the build stage — the prebuild sync
      # script bakes plugin React pages into the Next.js app tree.
      # Requires the repo-root .dockerignore to keep the context lean.
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: redwire-frontend:latest
    container_name: redwire-frontend
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: production

    depends_on:
      - backend
    # No volume mounts - use the built image artifacts
    networks:
      - redwire-network
    restart: always

  nginx:
    image: nginx:1.25-alpine
    container_name: redwire-nginx
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx/security
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    # Reload every 6h so certs renewed by the certbot container are picked up;
    # without this nginx keeps serving the old cert from memory until restarted.
    # The backend (UID 10001, non-root) truncates access.json after ingesting
    # it, so hand the file to that UID — at start and before each reload
    # (a reload reopens logs and would recreate a missing file as root).
    command: ["/bin/sh", "-c", "own() { touch /var/log/nginx/security/access.json && chown 10001:10001 /var/log/nginx/security/access.json; }; own; while :; do sleep 6h & wait $${!}; own; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on:
      - frontend
      - backend
    networks:
      - redwire-network
    restart: always

  certbot:
    image: certbot/certbot
    container_name: redwire-certbot
    logging: *default-logging
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - redwire-network

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: redwire-mcp-server:latest
    container_name: redwire-mcp
    logging: *default-logging
    environment:
      REDWIRE_API_URL: http://backend:8000
      MCP_PORT: "3001"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

    depends_on:
      - backend
    networks:
      - redwire-network
    restart: always

volumes:
  nginx_logs:
  postgres_data:
  redis_data:
  minio_data:

networks:
  redwire-network:
    driver: bridge
