[pytest]
# asyncio_mode = auto lets async test functions run without a per-test
# @pytest.mark.asyncio marker (the existing suite mixes both styles).
asyncio_mode = auto

# Only collect the real suite under tests/. This deliberately excludes the
# ad-hoc backend/*.py verification scripts at the repo root so a bare
# `pytest` from the backend dir doesn't try to run them as tests.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep output readable; the suite is import-heavy and Pydantic v2 emits a
# lot of class-based-config deprecation warnings from the routers.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    integration: exercises the app end-to-end against the test Postgres DB (needs the db fixtures)
