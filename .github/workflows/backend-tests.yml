name: backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: redwire
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: redwire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U redwire"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The suite derives <db>_test from DATABASE_URL; the migration test
      # creates (and drops) its own throwaway database next to it.
      DATABASE_URL: postgresql+asyncpg://redwire:ci-only-password@localhost:5432/redwire
      RATE_LIMIT_STORAGE_URI: memory://
      WS_FANOUT: "false"
      REDIS_URL: redis://localhost:6379/0
      # Several modules create the evidence bucket at import time.
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # A service container can't be given MinIO's `server` command. MinIO
      # no longer publishes images (minio/minio is gone from Docker Hub), so
      # CI uses pgsty/minio, a maintained community build with the same CLI.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-secret \
            pgsty/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Create the test database and throwaway keys
        run: |
          PGPASSWORD=ci-only-password psql -h localhost -U redwire -d redwire -c "CREATE DATABASE redwire_test"
          python - >> "$GITHUB_ENV" <<'EOF'
          import base64, os, secrets
          print("JWT_SECRET=" + secrets.token_hex(32))
          print("VAULT_ENCRYPTION_KEY=" + base64.urlsafe_b64encode(os.urandom(32)).decode())
          print("TOTP_ENCRYPTION_KEY=" + base64.urlsafe_b64encode(os.urandom(32)).decode())
          EOF
      - name: pytest
        working-directory: backend
        run: python -m pytest -q -p no:warnings tests
