user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
 
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
 
    # $uri (decoded path, no query string) instead of $request (method + raw
    # URI-with-query + version) so any future token-in-URL regression doesn't
    # end up in the access log. GHSA-qf2j-p8q7-v98h follow-up.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Second copy, as JSON, on the shared nginx_logs volume — the backend
    # ingests it for the admin Security Center (utils/http_log_ingest.py) and
    # truncates it once read. Same privacy choice as above — no query string —
    # but the path is the one the client sent ($uri is post-rewrite, so
    # /api/health would log as /health).
    map $request_uri $request_path {
        "~^(?<p>[^?]*)"  $p;
        default          $request_uri;
    }
    log_format  security_json  escape=json
                '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                '"path":"$request_path","status":$status,"bytes":$body_bytes_sent,'
                '"rt":$request_time,"host":"$host","ref":"$http_referer","ua":"$http_user_agent"}';
    access_log  /var/log/nginx/security/access.json  security_json;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;
}
